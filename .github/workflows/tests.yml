name: Tests and Lint

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pytest pytest-cov flake8

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests with coverage
        run: pytest --cov=turntable_source_shapes --cov-report=term-missing
